server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/calls}
    username: ${DATABASE_USER:calls}
    password: ${DATABASE_PASSWORD:calls}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 0B
app:
  bucket: ${S3_BUCKET:call-recordings}
  s3-endpoint: ${S3_ENDPOINT:http://localhost:9000}
  s3-access-key: ${S3_ACCESS_KEY:localminio}
  s3-secret-key: ${S3_SECRET_KEY:change-this-local-secret}
  demo-user-id: 11111111-1111-4111-8111-111111111111
  max-transcript-characters: ${MAX_TRANSCRIPT_CHARACTERS:12000}
  llm:
    max-input-tokens: ${LLM_MAX_INPUT_TOKENS:3000}
    max-output-tokens: ${LLM_MAX_OUTPUT_TOKENS:300}
    max-estimated-cost-usd: ${LLM_MAX_ESTIMATED_COST_USD:0.05}
    input-cost-per-million-tokens: ${LLM_INPUT_COST_PER_MILLION_TOKENS:1.75}
    output-cost-per-million-tokens: ${LLM_OUTPUT_COST_PER_MILLION_TOKENS:14}
  ai:
    provider: ${AI_PROVIDER:demo}
  openai:
    api-key: ${OPENAI_API_KEY:}
    transcription-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-transcribe}
    summary-model: ${OPENAI_SUMMARY_MODEL:gpt-5.2}
  groq:
    api-key: ${GROQ_API_KEY:}
    transcription-model: ${GROQ_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
    summary-model: ${GROQ_SUMMARY_MODEL:openai/gpt-oss-20b}
