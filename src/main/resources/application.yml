server:
  port: 8080
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/calls}
    username: ${DATABASE_USER:calls}
    password: ${DATABASE_PASSWORD:calls}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
      file-size-threshold: 0B
app:
  bucket: ${S3_BUCKET:call-recordings}
  s3-endpoint: ${S3_ENDPOINT:http://localhost:9000}
  s3-access-key: ${S3_ACCESS_KEY:localminio}
  s3-secret-key: ${S3_SECRET_KEY:change-this-local-secret}
  demo-user-id: 11111111-1111-4111-8111-111111111111
  max-transcript-characters: ${MAX_TRANSCRIPT_CHARACTERS:12000}
