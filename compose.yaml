services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: calls
      POSTGRES_USER: calls
      POSTGRES_PASSWORD: calls
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calls -d calls"]
      interval: 5s
      retries: 20

  minio:
    build: ./infra/minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: localminio
      MINIO_ROOT_PASSWORD: change-this-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/calls
      DATABASE_USER: calls
      DATABASE_PASSWORD: calls
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: call-recordings
      S3_ACCESS_KEY: localminio
      S3_SECRET_KEY: change-this-local-secret
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
